<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f2ef;font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.lh{position:relative;overflow:hidden;background:#111;color:#fff;padding:34px 20px 74px;text-align:center;border-radius:0 0 36px 36px}
.lh .lg{width:76px;height:76px;border-radius:50%;margin:0 auto 14px;background:var(--o,#ff7a1a);display:grid;place-items:center;font-size:34px;font-weight:800;overflow:hidden;border:3px solid rgba(255,255,255,.2)}.lh .lg img{width:100%;height:100%;object-fit:cover}
.lh h2{margin:0;font-size:22px;letter-spacing:-.01em}.lh p{margin:6px 0 0;color:#b8b8bf;font-size:14px}
#f{background:#fff;max-width:420px;margin:-48px 16px 0;margin-left:auto;margin-right:auto;width:calc(100% - 32px);border-radius:28px;padding:22px 20px 20px;box-shadow:0 18px 50px rgba(15,23,42,.14);border:0;position:relative}
#f h1{margin:0 0 14px;font-size:22px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#f1f0ee;border-radius:999px;padding:5px;margin-bottom:16px}
.roles button{border:0;background:none;padding:11px 4px;border-radius:999px;font:700 14px inherit;font-family:inherit;color:#555;cursor:pointer;box-shadow:none;transition:.2s}
.roles button.on{background:#111;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#f label{display:block;font-size:13px;font-weight:700;color:#444;margin:12px 0 6px}
#f input{width:100%;box-sizing:border-box;border:1.5px solid #e6e4e0;background:#faf9f7;border-radius:16px;padding:14px 16px;font:500 16px inherit;font-family:inherit;outline:0;margin:0}
#f input:focus{border-color:var(--o,#111);background:#fff}
.pw{position:relative}.pw input{padding-right:70px}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:#666;font:700 13px inherit;font-family:inherit;padding:8px 10px;cursor:pointer;box-shadow:none}
#go{width:100%;margin-top:18px;border:0;border-radius:999px;background:#111;color:#fff;padding:15px;font:700 16px inherit;font-family:inherit;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;transition:transform .2s}
#go:active{transform:scale(.97)}#go:disabled{opacity:.85;cursor:progress}
.spn{width:17px;height:17px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#m{min-height:20px;margin-top:12px;text-align:center;font-size:14px;color:#d93025}
#f .web{display:block;text-align:center;margin-top:10px;color:var(--o,#111);text-decoration:none;font-weight:700;font-size:14px}
.lart{position:absolute;inset:0;pointer-events:none}.lart .mp{position:absolute;width:96px;opacity:.95}.lart .m1{left:-14px;top:10px;transform:rotate(-8deg)}.lart .m2{right:-14px;top:16px;transform:rotate(8deg)}.lart .pav{position:absolute;width:40px;height:40px;border-radius:50%;overflow:hidden;border:3px solid #fff;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:pfl 4.5s ease-in-out infinite}.lart .pav svg{width:100%;height:100%;display:block}.lart .a1{left:92px;top:88px}.lart .a2{right:92px;top:78px;animation-delay:-2s}@keyframes pfl{50%{transform:translateY(-5px)}}.lh>*:not(.lart){position:relative}
*{-webkit-tap-highlight-color:transparent}
</style></head>
<body>
<div class="lh"><div class="lart" id="lart"></div><div class="lg" id="lg">S</div><h2 id="sn"></h2><p>Sign in to your school portal</p></div>
<form id="f" autocomplete="off"><h1>Welcome back 👋</h1>
<div class="roles" id="roles"><button type="button" data-r="student" class="on">Student</button><button type="button" data-r="teacher">Teacher</button><button type="button" data-r="admin">Admin</button></div>
<input type="hidden" name="role" value="student">
<label id="l1">Student ID</label><input name="uid" required autocomplete="username" autocapitalize="characters" placeholder="e.g. S001">
<label id="l2">PIN</label><div class="pw"><input name="secret" id="secret" type="password" required autocomplete="current-password" placeholder="Enter your PIN"><button type="button" id="eye">Show</button></div>
<button id="go" type="submit">Login</button><div id="m"></div><a class="web" href="index.html">← Back to website</a></form>
<script src="config.js"></script><script src="assets/js/avatars.js?v=64"></script><script src="assets/js/panel-art.js?v=64"></script><script src="assets/js/i18n.js?v=64"></script><script src="assets/js/i18n-extra.js?v=64"></script><script src="assets/js/lang.js?v=64"></script><script src="assets/js/api.js?v=64"></script><script src="assets/js/themes.js?v=64"></script>
<script>
try{document.getElementById('lart').innerHTML=PA.mini('cap').replace('class="mp"','class="mp m1"')+PA.mini('trophy').replace('class="mp"','class="mp m2"')+'<span class="pav a1">'+AV.svg(30)+'</span><span class="pav a2">'+AV.svg(5)+'</span>'}catch(e){}
const f=document.getElementById('f'),m=document.getElementById('m'),go=document.getElementById('go');
const LBL={student:['Student ID','PIN','e.g. S001','Enter your PIN'],teacher:['Teacher ID','Password','e.g. T001','Enter your password'],admin:['Admin ID','Password','Admin ID','Enter your password']};
document.getElementById('roles').onclick=e=>{const b=e.target.closest('button[data-r]');if(!b)return;document.querySelectorAll('#roles button').forEach(x=>x.classList.toggle('on',x===b));f.role.value=b.dataset.r;const L=LBL[b.dataset.r];document.getElementById('l1').textContent=L[0];document.getElementById('l2').textContent=L[1];f.uid.placeholder=L[2];f.secret.placeholder=L[3];m.textContent=''};
document.getElementById('eye').onclick=e=>{const s=f.secret;s.type=s.type==='password'?'text':'password';e.target.textContent=s.type==='password'?'Show':'Hide'};
(async()=>{try{const r=await fetch('content/site.json?v='+Date.now());if(r.ok){const o=await r.json();for(const k in(o.CFG||{}))if(k!=='api')CFG[k]=o.CFG[k];window.__PH=o.PH||{}}}catch(e){}
 if(typeof applyTheme==='function')applyTheme();
 document.getElementById('sn').textContent=SN();document.title='Login · '+SN();
 let l=CFG.logo||'';l=(window.__PH&&window.__PH[l])||l;const lg=document.getElementById('lg');
 if(/^uploads\//.test(l)||/^https:\/\//.test(l)){const i=new Image();i.alt='';i.onload=()=>{lg.textContent='';lg.append(i)};i.src=l}else lg.textContent=(CFG.shortName||SN()||'S').trim().charAt(0)})();
if(TOK.get())api('me').then(r=>{if(r.ok)location.replace('dashboard.html');else if(r.error==='Session expired. Please login again.')TOK.clear()}).catch(()=>{});
f.onsubmit=async e=>{e.preventDefault();m.textContent='';go.disabled=true;go.innerHTML='<span class="spn"></span>Signing in…';
 try{const r=await api('login',{role:f.role.value,id:f.uid.value.trim(),secret:f.secret.value});
  if(!r.ok){m.textContent=r.error||'Error';go.disabled=false;go.textContent='Login';return}
  TOK.set(r.token);go.innerHTML='<span class="spn"></span>Opening…';location.href='dashboard.html'}
 catch(x){m.textContent='Network problem. Please try again.';go.disabled=false;go.textContent='Login'}};
</script></body></html>
