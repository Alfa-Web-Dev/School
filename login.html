<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="assets/css/app.css"><link rel="manifest" href="manifest-student.webmanifest"><meta name="theme-color" content="#1d4ed8"><link rel="apple-touch-icon" href="assets/img/icon-192.png"></head>
<body><form class="card" id="f" autocomplete="off">
<h1 data-i="login"></h1><p class="mu" id="sn"></p>
<label data-i="as"></label><select name="role"><option value="student" data-i="student"></option><option value="teacher" data-i="teacher"></option><option value="admin" data-i="admin"></option></select>
<label data-i="uid"></label><input name="uid" required>
<label data-i="pw"></label><input name="secret" type="password" required>
<button data-i="go"></button><button type="button" class="g" id="lang"></button><div id="m"></div><p style="text-align:center;margin:14px 0 0"><a href="website.html" data-i="website" style="color:var(--c);text-decoration:none;font-weight:600"></a></p></form>
<script src="config.js"></script><script src="assets/js/i18n.js"></script><script src="assets/js/i18n-extra.js"></script><script src="assets/js/api.js"></script>
<script>
const f=document.getElementById('f'),m=document.getElementById('m'),lb=document.getElementById('lang');
const paint=()=>{applyI18n();lb.textContent=t('lang')};
document.getElementById('sn').textContent=CFG.name;paint();
lb.onclick=()=>{setLang(getLang()==='hi'?'en':'hi');paint()};
f.onsubmit=async e=>{e.preventDefault();m.textContent=t('wait');
 try{const r=await api('login',{role:f.role.value,id:f.uid.value,secret:f.secret.value});
  if(!r.ok){m.textContent=r.error||'Error';return}
  sessionStorage.setItem(SK,r.token);location.href='dashboard.html'}
 catch(x){m.textContent=t('neterr')}};
</script></body></html>
