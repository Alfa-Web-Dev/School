<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="assets/css/app.css"></head>
<body><div class="card"><h1><span data-i="hello"></span>, <span id="who"></span></h1><p class="mu" data-i="ok"></p><button class="g" id="lo" data-i="logout"></button></div>
<script src="config.js"></script><script src="assets/js/i18n.js"></script><script src="assets/js/lang.js"></script><script src="assets/js/api.js"></script>
<script>
applyI18n();
(async()=>{try{const r=await api('me');if(!r.ok){location.href='login.html';return}
 document.getElementById('who').textContent=r.user.name+' ('+r.user.role+')';
 const home={admin:'admin',teacher:'teacher',student:'student'}[r.user.role];
 if(home&&!location.search.includes('stay'))location.replace(home+'/index.html')}catch(e){location.href='login.html'}})();
document.getElementById('lo').onclick=async()=>{try{await api('logout')}catch(e){}sessionStorage.clear();location.href='login.html'};
</script></body></html>
